<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Карточка товара</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page">
    <article class="product-card product-card--featured">
      <figure class="product-card__media">
        <img
          class="product-card__image"
          src="./Снимок экрана 2025-10-23 163850.png"
          alt="Беспроводные наушники ArcSound X5"
        />
      </figure>
      <div class="product-card__content">
        <p class="product-card__label">Аудио</p>
        <h1 class="product-card__title">Беспроводные наушники ArcSound X5</h1>
        <p class="product-card__description">
          Полноразмерная модель с активным шумоподавлением, Bluetooth 5.3 и
          автономностью до 40 часов.
        </p>
        <p class="product-card__price">12 990 ₽</p>
        <a class="product-card__button" href="#">Добавить в корзину</a>
      </div>
    </article>
  </main>
</body>
</html>
