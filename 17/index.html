<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/favicon-32x32.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
  <title>Практика 17 - Reminder Push</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Практика 17</p>
        <h1>Заметки с напоминаниями</h1>
      </div>
      <nav class="tabs" aria-label="Основная навигация">
        <button id="home-btn" class="tab active" type="button" data-page="home">Главная</button>
        <button id="about-btn" class="tab" type="button" data-page="about">О приложении</button>
      </nav>
    </header>

    <section id="app-content" class="workspace" aria-live="polite"></section>

    <footer class="status-panel">
      <div>
        <strong id="sw-status">Service Worker проверяется</strong>
        <span id="connection-status">Socket.IO подключается</span>
      </div>
      <div class="push-actions">
        <button id="enable-push" type="button">Включить Push</button>
        <button id="disable-push" class="danger" type="button" hidden>Отключить Push</button>
      </div>
    </footer>
  </main>

  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./app.js"></script>
</body>
</html>
